# Deployed through the Cloudflare API (free plan). `wrangler deploy` works too.
name = "tradehax-cron"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
# UTC. Ten minutes after each GitHub slot in data.yml, so a run that GitHub
# fired on time makes this one skip.
crons = ["17,47 12-22 * * 1-5", "21 13 * * 6"]
