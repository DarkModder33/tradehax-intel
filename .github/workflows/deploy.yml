name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A data-branch push uses the default token and does not start this workflow.
    # workflow_run does, and only after that job succeeds. The site itself is always built from main.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_WORKER_URL: ${{ vars.WORKER_URL || 'https://tradehax-intel-worker-bf2f623ce81a.herokuapp.com' }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/tradehax-intel' }}

      - name: Checkout data branch
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: data
          path: data-branch

      - name: Copy precomputed data
        run: |
          mkdir -p out/data
          if [ -d data-branch/data ]; then cp -a data-branch/data/. out/data/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
