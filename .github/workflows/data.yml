name: data

on:
  schedule:
    # 13:30 UTC is 08:30 ET on standard time and 09:30 ET on daylight time.
    # 17:30 and 21:30 UTC are midday and 16:30 ET on standard time.
    - cron: "15 12 * * 1-5"
    - cron: "30 13 * * 1-5"
    - cron: "*/30 14-21 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "30 21 * * 1-5"
    - cron: "30 22 * * 1-5"
    - cron: "0 13 * * 6"
  workflow_dispatch: {}

concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF tools
        run: sudo apt-get install -y poppler-utils

      - name: Prepare data branch
        run: |
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add /tmp/tradehax-data origin/data
          else
            git worktree add --detach /tmp/tradehax-data
            git -C /tmp/tradehax-data checkout --orphan data
            # The orphan keeps main's index. Drop it so the branch holds only data/.
            git -C /tmp/tradehax-data rm -q -rf --cached .
            git -C /tmp/tradehax-data clean -fdx
          fi
          mkdir -p /tmp/tradehax-data/data
          rm -rf prev
          mkdir -p prev
          cp -a /tmp/tradehax-data/data prev/data

      - name: Build datasets
        run: node --experimental-strip-types scripts/data/run.mjs --job "${{ github.event.schedule }}"
        env:
          DATA_DIR: /tmp/tradehax-data/data
          PREV_DIR: prev/data
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_PUBLISH_TOKEN: ${{ secrets.WORKER_PUBLISH_TOKEN }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}

      - name: Generate news
        run: node scripts/news/generate.mjs && node scripts/news/indexnow.mjs || echo "news generate failed"
        env:
          DATA_DIR: /tmp/tradehax-data/data
          PREV_DIR: prev/data
          NEWS_OUT: /tmp/tradehax-data/data/news/stories.json
          NEWS_FILE: /tmp/tradehax-data/data/news/stories.json
          INDEXNOW: "1"

      - name: Post stories
        run: node scripts/social/post.mjs || echo "social post failed"
        env:
          SOCIAL_AUTOPOST: ${{ vars.SOCIAL_AUTOPOST || '1' }}
          SOCIAL_DRYRUN: ${{ vars.SOCIAL_DRYRUN || '0' }}
          SOCIAL_CAP: ${{ vars.SOCIAL_CAP || '8' }}
          NEWS_FILE: /tmp/tradehax-data/data/news/stories.json
          SOCIAL_LEDGER: /tmp/tradehax-data/data/social-posted.json
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Publish data branch
        run: |
          cd /tmp/tradehax-data
          git config user.name "tradehax-data-bot"
          git config user.email "actions@users.noreply.github.com"
          # /data is gitignored on main. -f stages it on this branch anyway.
          git add -f data
          git commit -m "data: $(date -u +%FT%TZ)" || echo "no changes"
          git push origin HEAD:data
