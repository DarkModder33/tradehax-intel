name: social

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 builds the post and does not send"
        required: false
        default: "0"
        type: string
      cap:
        description: "Maximum stories to send"
        required: false
        default: "1"
        type: string
      platforms:
        description: "Comma-separated platforms: discord,telegram,x"
        required: false
        default: "discord,telegram"
        type: string

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Checkout data branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: data-branch

      - name: Post stories
        run: |
          if [ -f data-branch/data/news/stories.json ]; then
            export NEWS_FILE=data-branch/data/news/stories.json
          else
            export NEWS_FILE=content/news/stories.json
          fi
          export SOCIAL_LEDGER=data-branch/data/social-posted.json
          mkdir -p data-branch/data
          node scripts/social/seed-ledger.mjs
          node scripts/social/post.mjs
        env:
          SOCIAL_AUTOPOST: "1"
          SOCIAL_DRYRUN: ${{ inputs.dry_run }}
          SOCIAL_CAP: ${{ inputs.cap }}
          SOCIAL_PLATFORMS: ${{ inputs.platforms }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Persist ledger
        run: |
          git -C data-branch config user.name "tradehax-data-bot"
          git -C data-branch config user.email "actions@users.noreply.github.com"
          git -C data-branch add -f data/social-posted.json
          if git -C data-branch diff --cached --quiet; then
            echo "no ledger change"
            exit 0
          fi
          git -C data-branch commit -m "social: record posted stories"
          for attempt in 1 2 3; do
            if git -C data-branch push origin HEAD:data; then
              exit 0
            fi
            git -C data-branch fetch origin data
            git -C data-branch rebase origin/data
          done
          echo "ledger push failed"
          exit 1
